# Mantiene activo el proyecto de Supabase (plan gratis).
#
# Supabase pausa los proyectos gratis tras 7 días sin actividad. Este
# workflow hace una consulta pequeña a la base todos los días para que
# cuente como actividad.
#
# Requisitos (una sola vez), en GitHub:
#   Settings > Secrets and variables > Actions > New repository secret
#     SUPABASE_URL       -> el mismo valor de SUPABASE_URL del .env
#     SUPABASE_ANON_KEY  -> el mismo valor de SUPABASE_ANON_KEY del .env
#
# Para probarlo a mano: pestaña Actions > "Supabase keep-alive" > Run workflow.

name: Supabase keep-alive

on:
  schedule:
    # Todos los días a las 13:00 UTC (8:00 a. m. hora de Perú)
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan los secretos SUPABASE_URL y/o SUPABASE_ANON_KEY en GitHub (Settings > Secrets and variables > Actions)."
            exit 1
          fi

          URL="${SUPABASE_URL%/}/rest/v1/productos?select=estilo&limit=1"

          for intento in 1 2 3; do
            STATUS=$(curl -s -o respuesta.json -w "%{http_code}" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "$URL")
            echo "Intento $intento: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Supabase activo ✅"
              exit 0
            fi
            sleep 20
          done

          echo "::error::Supabase no respondió bien (HTTP $STATUS). Si el proyecto ya está en pausa, reactívalo desde supabase.com."
          cat respuesta.json || true
          exit 1
